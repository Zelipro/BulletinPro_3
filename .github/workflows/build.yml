name: Build BulletinPro with PyInstaller

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller `
          --name=BulletinPro `
          --onefile `
          --windowed `
          --add-data "config.py;." `
          --hidden-import=flet.fastapi `
          --hidden-import=flet_core `
          --hidden-import=flet_runtime `
          --hidden-import=cairocffi `
          --hidden-import=weasyprint `
          --collect-all=flet `
          --collect-all=flet_core `
          --collect-all=flet_runtime `
          --collect-all=weasyprint `
          --collect-all=cairocffi `
          Page2.py
      shell: powershell
    
    - name: Test executable
      run: |
        if (Test-Path dist/BulletinPro.exe) {
          Write-Host "✅ Executable created"
          Get-Item dist/BulletinPro.exe | Select-Object Name, Length
        } else {
          Write-Host "❌ Build failed"
          exit 1
        }
      shell: powershell
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: BulletinPro-Windows
        path: dist/BulletinPro.exe

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libpangocairo-1.0-0 \
          libgdk-pixbuf-2.0-0 \
          libffi-dev \
          shared-mime-info \
          dpkg-dev \
          fakeroot
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller \
          --name=BulletinPro \
          --onefile \
          --windowed \
          --add-data "config.py:." \
          --hidden-import=flet.fastapi \
          --hidden-import=flet_core \
          --hidden-import=flet_runtime \
          --collect-all=flet \
          --collect-all=flet_core \
          --collect-all=flet_runtime \
          Page2.py
    
    - name: Test executable
      run: |
        if [ -f dist/BulletinPro ]; then
          echo "✅ Executable created"
          ls -lh dist/BulletinPro
          chmod +x dist/BulletinPro
        else
          echo "❌ Build failed"
          exit 1
        fi
    
    - name: Create DEB package
      run: |
        VERSION="1.0.2"
        PACKAGE="bulletinpro_${VERSION}_amd64"
        
        # Structure
        mkdir -p ${PACKAGE}/DEBIAN
        mkdir -p ${PACKAGE}/usr/bin
        mkdir -p ${PACKAGE}/usr/share/applications
        mkdir -p ${PACKAGE}/usr/share/doc/bulletinpro
        
        # Copy executable
        cp dist/BulletinPro ${PACKAGE}/usr/bin/bulletinpro
        chmod 755 ${PACKAGE}/usr/bin/bulletinpro
        
        # Control file
        cat > ${PACKAGE}/DEBIAN/control << 'EOF'
        Package: bulletinpro
        Version: 1.0.2
        Section: education
        Priority: optional
        Architecture: amd64
        Depends: libcairo2, libpango-1.0-0, libpangocairo-1.0-0, libgdk-pixbuf-2.0-0, libffi8 | libffi7, libc6
        Maintainer: BulletinPro Team <contact@bulletinpro.com>
        Description: Système de gestion de bulletins scolaires
         Application de gestion complète pour établissements scolaires.
         Génération de bulletins PDF, gestion des notes, sync cloud.
        EOF
        
        # Desktop entry
        cat > ${PACKAGE}/usr/share/applications/bulletinpro.desktop << 'EOF'
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=BulletinPro
        Comment=Gestion de bulletins scolaires
        Exec=/usr/bin/bulletinpro
        Icon=bulletinpro
        Terminal=false
        Categories=Education;Office;
        EOF
        
        # Postinst script
        cat > ${PACKAGE}/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e
        if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q
        fi
        echo "✅ BulletinPro installé avec succès !"
        echo "Lancez : bulletinpro"
        exit 0
        EOF
        chmod 755 ${PACKAGE}/DEBIAN/postinst
        
        # Build
        dpkg-deb --build ${PACKAGE}
        mv ${PACKAGE}.deb BulletinPro-${VERSION}-amd64.deb
        
        echo "📦 Package info:"
        dpkg-deb --info BulletinPro-${VERSION}-amd64.deb
    
    - name: Upload Linux executable
      uses: actions/upload-artifact@v4
      with:
        name: BulletinPro-Linux
        path: dist/BulletinPro
    
    - name: Upload DEB package
      uses: actions/upload-artifact@v4
      with:
        name: BulletinPro-DEB
        path: BulletinPro-*.deb

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: BulletinPro-Windows
        path: ./windows
    
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: BulletinPro-Linux
        path: ./linux
    
    - name: Download DEB artifact
      uses: actions/download-artifact@v4
      with:
        name: BulletinPro-DEB
        path: ./deb
    
    - name: Create checksums
      run: |
        cd windows && sha256sum BulletinPro.exe > checksums.txt && cd ..
        cd linux && sha256sum BulletinPro >> checksums.txt && cd ..
        cd deb && sha256sum *.deb >> checksums.txt && cd ..
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./windows/BulletinPro.exe
          ./linux/BulletinPro
          ./deb/*.deb
        body: |
          ## 🎉 BulletinPro ${{ github.ref_name }}
          
          ### 📥 Installation
          
          **Windows:**
          ```
          Téléchargez BulletinPro.exe
          Double-cliquez pour lancer
          ```
          
          **Linux (Ubuntu/Debian):**
          ```bash
          wget [lien-vers-deb]
          sudo dpkg -i BulletinPro-1.0.2-amd64.deb
          sudo apt-get install -f  # Si dépendances manquantes
          bulletinpro
          ```
          
          **Linux (Binaire):**
          ```bash
          chmod +x BulletinPro
          ./BulletinPro
          ```
          
          ### ✨ Correctifs
          - ✅ Fix: Module flet_desktop correctement inclus
          - ✅ Amélioration: Dépendances .deb complètes
          - ✅ PyInstaller pour meilleure compatibilité
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
